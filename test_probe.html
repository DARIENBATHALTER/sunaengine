<!doctype html>
<meta charset="utf-8">
<title>sunaengine kosher probe</title>
<canvas id="c" width="320" height="180"></canvas>
<script type="module">
// Kosher probe for the PUBLIC stripped engine. Verifies, by RUNNING:
//  1. Two instances from identical seeds stay hash-identical (determinism claim).
//  2. Spawned water actually INTERACTS (density solve does something). The
//     degenerate-prefix-sum host code means anything outside grid cell 0 gets
//     zero neighbors. That is a physics-correctness claim, not determinism.
//  3. The push tool path (page demo 2) — asserts impulses land.
import { SunaEngine } from '/src/engine.js';
import { ONE } from '/src/common.js';

const out = { checks: [], log: [] };
const ok = (name, pass, note='') => out.checks.push({ name, pass: !!pass, note });

function stateOf(eng) { return eng._lastState; }
function countMoving(eng) {
  const s = stateOf(eng); if (!s) return -1;
  let moving = 0;
  for (let i = 0; i < eng.n; i++) {
    const b = i * 8;
    if (s[b+2] !== 0 || s[b+3] !== 0) moving++;
  }
  return moving;
}
// Mean pairwise proximity: interactive fluid packs; non-interacting dots just
// stack on the floor at rest spacing or spread in free fall.
function fluidYs(eng) {
  const s = stateOf(eng); const ys = [];
  const wallCount = eng.n - eng.nFluid;
  for (let i = wallCount; i < eng.n; i++) ys.push(s[i*8+1]);
  return ys;
}
function spread(a) {
  if (!a.length) return 0;
  return (Math.max(...a) - Math.min(...a)) / ONE;
}

const a = new SunaEngine(document.getElementById('c'), { w: 64, h: 36, maxParticles: 2048 });
const b = new SunaEngine(document.getElementById('c'), { w: 64, h: 36, maxParticles: 2048 });

// Capture GPU validation errors — PLATFORM_NOTES trap #1 style.
const gpuErrors = [];
function hookDevice(eng) {
  const d = eng._device;
  if (!d) return;
  d.onuncapturederror = (ev) => gpuErrors.push(String(ev.error && ev.error.message || ev));
  d.addEventListener?.('uncapturederror', (ev) => gpuErrors.push(String(ev.error && ev.error.message || ev)));
}

try {
  await a.init(); await b.init();
  hookDevice(a); hookDevice(b);
  // Determinism: identical spawns at the DEMO's own coordinates.
  a.spawn(20, 28, 4); a.spawn(44, 28, 4);
  b.spawn(20, 28, 4); b.spawn(44, 28, 4);
  for (let f = 0; f < 90; f++) { a.step(); b.step(); await a.render(); }
  await b.render();
  const hA = a.getHash(), hB = b.getHash();
  ok('determinism.hashIdentical', hA === hB && hA.length === 64,
     `A=${hA.slice(0,16)}… B=${hB.slice(0,16)}…`);
  out.gpuErrors = gpuErrors.slice(0, 6);
  ok('noGpuValidationErrors', gpuErrors.length === 0, gpuErrors[0] || 'clean');

  // Liveness: did anything move?
  ok('liveness.particlesMoved', countMoving(a) > 0, `${countMoving(a)} with nonzero vel`);

  // Interaction: spawn a COLUMN at x=48 (grid cell 12, NOT cell 0) and let it
  // fall onto the floor. Interactive water SPREADS sideways under pressure.
  // Non-interacting dots stack in a column of rest spacing.
  const c2 = new SunaEngine(document.getElementById('c'), { w: 64, h: 36, maxParticles: 2048 });
  await c2.init();
  c2.spawn(48, 28, 5);            // a blob high on the right side
  for (let f = 0; f < 240; f++) { c2.step(); if ((f & 31) === 0) await c2.render(); }
  await c2.render();
  const ys = fluidYs(c2);
  const s = stateOf(c2);
  const wallCount = c2.n - c2.nFluid;
  let xs = [];
  for (let i = wallCount; i < c2.n; i++) xs.push(s[i*8]);
  const xSpread = (Math.max(...xs) - Math.min(...xs)) / ONE;
  const ySpread = spread(ys);
  // A 5wu-radius blob is ~10wu wide to start. If it lands and just stacks,
  // x-spread stays ~10 and y-spread grows tall. If pressure solves, it widens.
  out.log.push(`blob: xSpread=${xSpread.toFixed(2)}wu ySpread=${ySpread.toFixed(2)}wu n=${c2.nFluid}`);
  // Interaction evidence: any fluid particle with horizontal VELOCITY component
  // from pressure (not just falling straight down). In free-fall-only dots vx
  // stays 0 forever (spawned at rest, gravity is -y only).
  let vxCount = 0;
  for (let i = wallCount; i < c2.n; i++) if (s[i*8+2] !== 0) vxCount++;
  ok('physics.densitySolveActs', vxCount > 0 || xSpread > 11,
     `vx!=0 count=${vxCount} of ${c2.nFluid}, xSpread=${xSpread.toFixed(2)}wu (spawned ~10wu)`);

  // Push: an impulse changes velocity, deterministically.
  await c2.pushParticles(48, 10, 8, 2000, 0);
  await c2.render();
  let vxAfter = 0;
  const s3 = stateOf(c2);
  for (let i = wallCount; i < c2.n; i++) if (s3[i*8+2] > 0) vxAfter++;
  ok('push.impulseLands', vxAfter > 0, `${vxAfter} particles pushed right`);
} catch (e) {
  out.fatal = String(e && e.message || e);
}
out.pass = out.checks.every(c => c.pass) && !out.fatal;
window.__RESULT__ = out;
</script>
